<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Romkart – møterommene våre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+Runic&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #e9ece8;
      --surface: #f6f7f3;
      --ink: #1d2c34;
      --ink-soft: #4f5f66;
      --line: #9aa7a6;
      --wall: #2c3d46;
      --floor: #dfe4df;
      --book: #2f6f62;
      --book-fill: #cfe2da;
      --nobook: #7a6a52;
      --nobook-fill: #e8dfcf;
      --common-fill: #e3e7e1;
      --gold: #b07d22;
      --gold-glow: rgba(176, 125, 34, .28);
      --exit: #2b8a46;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111b21;
        --surface: #18252d;
        --ink: #e8e4d8;
        --ink-soft: #a9b2ad;
        --line: #4c5c62;
        --wall: #b9c3bf;
        --floor: #1a272f;
        --book: #79c2ad;
        --book-fill: #1f3c37;
        --nobook: #d1b98d;
        --nobook-fill: #3a3226;
        --common-fill: #1f2d35;
        --gold: #e0ad4f;
        --gold-glow: rgba(224, 173, 79, .3);
        --exit: #6fd08a;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #111b21;
      --surface: #18252d;
      --ink: #e8e4d8;
      --ink-soft: #a9b2ad;
      --line: #4c5c62;
      --wall: #b9c3bf;
      --floor: #1a272f;
      --book: #79c2ad;
      --book-fill: #1f3c37;
      --nobook: #d1b98d;
      --nobook-fill: #3a3226;
      --common-fill: #1f2d35;
      --gold: #e0ad4f;
      --gold-glow: rgba(224, 173, 79, .3);
      --exit: #6fd08a;
      color-scheme: dark;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Alegreya", Georgia, "Times New Roman", serif;
      font-size: 1.0625rem;
      line-height: 1.55;
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: "Cinzel", "Alegreya", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
      margin: 0;
      letter-spacing: .01em;
    }

    .runes {
      font-family: "Noto Sans Runic", "Segoe UI Historic", sans-serif;
      color: var(--gold);
      letter-spacing: .35em;
    }

    header .runes {
      font-size: 1.05rem;
      margin-top: .4rem;
      display: block;
    }

    header p {
      margin: .75rem 0 0;
      color: var(--ink-soft);
      max-width: 62ch;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1.5rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .filters {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
    }

    .filters button {
      font: inherit;
      font-size: .95rem;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .3rem .9rem;
      cursor: pointer;
    }

    .filters button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .legend {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      font-size: .93rem;
      color: var(--ink-soft);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
    }

    .sw {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 2px solid;
      display: inline-block;
    }

    .sw.book {
      background: var(--book-fill);
      border-color: var(--book);
    }

    .sw.nobook {
      background: var(--nobook-fill);
      border-color: var(--nobook);
    }

    .sw.common {
      background: var(--common-fill);
      border-color: var(--line);
      border-style: dashed;
    }

    .sw.door {
      background: var(--gold);
      border-color: var(--gold);
      height: 5px;
    }

    .sw.exit {
      background: var(--exit);
      border-color: var(--exit);
      height: 5px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    @media (min-width: 981px) {
      .layout.has-selection {
        grid-template-columns: minmax(0, 1fr) 340px;
      }
    }

    .layout:not(.has-selection) .panel {
      display: none;
    }

    .map-frame {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: .75rem;
      overflow-x: auto;
    }

    .map-frame svg {
      display: block;
      width: 100%;
      min-width: 720px;
      height: auto;
    }

    /* Map elements */
    .floor {
      fill: var(--floor);
      stroke: var(--wall);
      stroke-width: 4;
    }

    .area {
      fill: var(--common-fill);
      stroke: var(--line);
      stroke-width: 1.5;
      stroke-dasharray: 6 5;
    }

    .area-label {
      fill: var(--ink-soft);
      font-family: "Alegreya", Georgia, serif;
      font-style: italic;
      font-size: 15px;
    }

    .service {
      fill: var(--common-fill);
      stroke: var(--wall);
      stroke-width: 2;
    }

    .service-label {
      fill: var(--ink-soft);
      font-family: "Alegreya", Georgia, serif;
      font-size: 13px;
    }

    .door {
      stroke: var(--gold);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .door.exit {
      stroke: var(--exit);
    }

    .door.inner {
      stroke-width: 4;
    }

    #doors {
      pointer-events: none;
    }

    .open-edge {
      stroke: var(--floor);
      stroke-width: 6;
    }

    .open-edge.dash {
      stroke: var(--nobook);
      stroke-width: 2;
      stroke-dasharray: 6 6;
    }

    .marker-label {
      font-family: "Alegreya", Georgia, serif;
      font-weight: 700;
      font-size: 15px;
      fill: var(--gold);
    }

    .marker-label.exit {
      fill: var(--exit);
    }

    .service-label.sub {
      font-size: 11px;
      font-style: italic;
    }

    .room {
      cursor: pointer;
      outline: none;
    }

    .room.utility .shape {
      fill: var(--common-fill);
      stroke: var(--wall);
      stroke-width: 2;
    }

    .room.utility .name {
      font-family: "Alegreya", Georgia, serif;
      font-weight: 500;
      fill: var(--ink-soft);
    }

    .room .shape {
      stroke-width: 3;
      transition: fill .2s, stroke .2s;
    }

    .room.bookable .shape {
      fill: var(--book-fill);
      stroke: var(--book);
    }

    .room.notbookable .shape {
      fill: var(--nobook-fill);
      stroke: var(--nobook);
    }

    .room .name {
      font-family: "Cinzel", "Alegreya", Georgia, serif;
      fill: var(--ink);
      font-weight: 700;
      pointer-events: none;
    }

    .room .cap {
      font-family: "Alegreya", Georgia, serif;
      fill: var(--ink-soft);
      font-size: 13px;
      pointer-events: none;
    }

    .room .rune {
      font-family: "Noto Sans Runic", "Segoe UI Historic", sans-serif;
      fill: var(--gold);
      font-size: 11px;
      letter-spacing: 2px;
      pointer-events: none;
    }

    .room:hover .shape {
      stroke: var(--gold);
    }

    .room:focus-visible .shape {
      stroke: var(--gold);
      stroke-width: 5;
    }

    .room.selected .shape {
      stroke: var(--gold);
      stroke-width: 5;
      filter: drop-shadow(0 0 8px var(--gold-glow));
    }

    .room.dimmed {
      opacity: .28;
    }

    /* Detail panel */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1.4rem 1.4rem 1.6rem;
      position: sticky;
      top: calc(1rem + env(safe-area-inset-top, 0px));
    }

    @media (max-width: 980px) {
      .panel {
        position: static;
      }
    }

    .panel .empty {
      color: var(--ink-soft);
      margin: 0;
    }

    .panel h2 {
      font-family: "Cinzel", "Alegreya", Georgia, serif;
      font-weight: 700;
      font-size: 2rem;
      line-height: 1.1;
      margin: 0;
    }

    .panel .runes {
      display: block;
      font-size: .95rem;
      margin: .3rem 0 .2rem;
    }

    .panel .type {
      color: var(--ink-soft);
      font-style: italic;
      margin: 0 0 1rem;
    }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
      margin-bottom: 1.2rem;
    }

    .fact {
      border-top: 2px solid var(--line);
      padding-top: .4rem;
    }

    .fact b {
      display: block;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    .fact small {
      color: var(--ink-soft);
      font-size: .88rem;
    }

    .fact.yes {
      border-color: var(--book);
    }

    .fact.yes b {
      color: var(--book);
    }

    .fact.no {
      border-color: var(--nobook);
    }

    .fact.no b {
      color: var(--nobook);
    }

    .panel h3 {
      font-size: 1rem;
      font-weight: 700;
      margin: 1.1rem 0 .35rem;
    }

    .panel p {
      margin: 0;
    }

    .gear {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .gear li {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .1rem .55rem;
      font-size: .95rem;
    }

    .lore {
      margin-top: 1.3rem;
      padding: 1rem 1.1rem;
      border-left: 3px solid var(--gold);
      background: var(--bg);
      border-radius: 0 4px 4px 0;
    }

    .lore h3 {
      margin-top: 0;
    }

    /* Room list */
    .list-section {
      margin-top: 2.25rem;
    }

    .list-section h2 {
      font-family: "Cinzel", "Alegreya", Georgia, serif;
      font-weight: 700;
      font-size: 1.5rem;
      margin: 0 0 .9rem;
    }

    .room-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: .5rem;
    }

    .room-list button {
      width: 100%;
      text-align: left;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--book);
      border-radius: 4px;
      padding: .55rem .8rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .5rem;
    }

    .room-list button.nb {
      border-left-color: var(--nobook);
    }

    .room-list button.ut {
      border-left-color: var(--line);
    }

    .room-list button.ut .rn {
      font-family: "Alegreya", Georgia, serif;
    }

    .room-list button[aria-current="true"] {
      outline: 2px solid var(--gold);
    }

    .room-list button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .room-list .rn {
      font-family: "Cinzel", "Alegreya", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .room-list .rm {
      color: var(--ink-soft);
      font-size: .9rem;
      text-align: right;
    }

    .room-list li.dimmed {
      opacity: .35;
    }

    .filters button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }

    .list-section {
      display: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Møterommene våre</h1>
      <span class="runes" aria-hidden="true">ᛗᛟᛏᛖᚱᛟᛗᛗᛖᚾᛖ ᚹᚨᚱᛖ</span>
      <!-- <p>Trykk på et rom i kartet eller i lista for å se hvor mange det er plass til, hva rommet brukes til, hvilket
        utstyr som finnes der og hvem rommet er oppkalt etter.</p> -->

    <div class="controls">
      <div class="filters" role="group" aria-label="Filtrer rom">
        <button type="button" data-filter="all" aria-pressed="true">Alle rom</button>

        <button type="button" data-filter="utility" aria-pressed="false">Fasiliteter</button>
      </div>
      <div class="legend">
        <span><i class="sw book"></i>Kan bookes</span>
        <span><i class="sw nobook"></i>Kan ikke bookes</span>
        <span><i class="sw common"></i>Fellesareal</span>
        <span><i class="sw door"></i>Inngang</span>
        <span><i class="sw exit"></i>Nødutgang</span>
      </div>
    </div>

    <div class="layout">
      <div class="map-frame">
        <svg id="map" viewBox="20 240 1320 625" role="group" aria-label="Plantegning med møterom">

          <rect class="area" x="997" y="345" width="83" height="413" />

          <rect class="service" x="468" y="462" width="47" height="80" />
          <text class="service-label" x="491" y="498" text-anchor="middle">WC</text>
          <text class="service-label sub" x="491" y="513" text-anchor="middle">Herre</text>
          <rect class="service" x="468" y="542" width="47" height="80" />
          <text class="service-label" x="491" y="578" text-anchor="middle">WC</text>
          <text class="service-label sub" x="491" y="593" text-anchor="middle">Dame</text>
          <line class="door inner" x1="478" y1="462" x2="505" y2="462" />
          <line class="door inner" x1="478" y1="622" x2="505" y2="622" />

          <rect class="service" x="810" y="455" width="180" height="26" />

    </div>

    <section class="list-section">
      <h2>Alle rom</h2>
      <ul class="room-list" id="list"></ul>

  </div>

  <script>
    const layout = document.querySelector(".layout");

    function deselect() {
      selected = null;
      layout.classList.remove("has-selection");
      document.querySelectorAll(".room").forEach(g => g.classList.remove("selected"));
      if (list) list.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", "false"));
      panel.innerHTML = "";
    }

    const ROOMS = [
      {
        id: "lagring", name: "Lagring", type: "Lager", utility: true,
        use: "Lagring av hygieneprodukter.",
        gear: ["Såpe", "Dopapir"],
        shape: {rect: [810, 560, 180, 62]}

        id: "printer", name: "Printerrom", type: "Lager og printerrom", utility: true,

        shape: {rect: [518, 455, 57, 167]}, vertical: true
      },
      {

        gear: ["Skjerm", "Dockingstasjon", "Webkamera"],

      },
      {

        lore: "En av Odins to ravner, og navnet betyr «tanke». Hugin og Munin flyr ut over verden hver dag og kommer tilbake med nytt. De er en duo, akkurat som de to like rommene.",
        shape: {rect: [296, 340, 52, 66]}, vertical: true
      },
      {
        id: "munin", name: "Munin", type: "Teamrom", cap: "1", bookable: false,
        use: "Drop-in-plass for én person.",
        gear: ["Bord og stol"],
        lore: "Odins andre ravn, og navnet betyr «minne». Sammen med Hugin danner den en duo – derfor er de to like rommene oppkalt etter ravnene.",
        shape: {rect: [351, 340, 54, 66]}, vertical: true
      },

    const RUNEMAP = {a: "ᚨ", b: "ᛒ", c: "ᚲ", d: "ᛞ", e: "ᛖ", f: "ᚠ", g: "ᚷ", h: "ᚺ", i: "ᛁ", j: "ᛃ", k: "ᚲ", l: "ᛚ", m: "ᛗ", n: "ᚾ", o: "ᛟ", p: "ᛈ", q: "ᚲ", r: "ᚱ", s: "ᛊ", t: "ᛏ", u: "ᚢ", v: "ᚹ", w: "ᚹ", x: "ᚲᛊ", y: "ᛁ", z: "ᛉ", "æ": "ᚨ", "ø": "ᛟ", "å": "ᚨ"};
    const toRunes = s => [...s.toLowerCase()].map(c => RUNEMAP[c] ?? (c === " " ? " " : "")).join("");
    const capText = c => c === "1" ? "1 person" : c + " personer";

    const NS = "http://www.w3.org/2000/svg";
    const roomsG = document.getElementById("rooms");
    const panel = document.getElementById("panel");
    const list = document.getElementById("list");
    let selected = null;
    let filter = "all";

    function el(tag, attrs = {}, text) {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (text != null) e.textContent = text;
      return e;
    }

    ROOMS.forEach(r => {
      const g = el("g", {
        class: "room " + (r.utility ? "utility" : r.bookable ? "bookable" : "notbookable"),
        tabindex: "0", role: "button", "data-id": r.id,
        "aria-label": r.utility ? `${r.name}, ${r.type.toLowerCase()}` : `${r.name}, ${r.type.toLowerCase()}, ${capText(r.cap)}, ${r.bookable ? "kan bookes" : "kan ikke bookes"}`
      });
      let cx, cy, w, h;
      if (r.shape.rect) {
        const [x, y, rw, rh] = r.shape.rect;
        g.appendChild(el("rect", {class: "shape", x, y, width: rw, height: rh}));
        cx = x + rw / 2; cy = y + rh / 2; w = rw; h = rh;
      } else {
        g.appendChild(el("polygon", {class: "shape", points: r.shape.poly}));
        [cx, cy] = r.label; w = 230; h = 160;
      }
      if (r.vertical) {
        g.appendChild(el("text", {class: "name", x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 15, transform: `rotate(-90 ${cx} ${cy})`}, r.name));
      } else {
        const big = w > 140 && h > 100;
        const fs = r.id === "valhall" ? 34 : big ? 24 : 17;
        g.appendChild(el("text", {class: "name", x: cx, y: cy + (h > 90 ? -2 : 5), "text-anchor": "middle", "font-size": fs}, r.name));
        if (h > 90) {
          g.appendChild(el("text", {class: "rune", x: cx, y: cy + 18, "text-anchor": "middle"}, toRunes(r.name)));
          g.appendChild(el("text", {class: "cap", x: cx, y: cy + 38, "text-anchor": "middle"}, capText(r.cap)));
        }
      }
      g.addEventListener("click", () => select(r.id));
      g.addEventListener("keydown", e => {if (e.key === "Enter" || e.key === " ") {e.preventDefault(); select(r.id);} });
      roomsG.appendChild(g);

      const li = document.createElement("li");
      li.dataset.id = r.id;
      const b = document.createElement("button");
      b.type = "button";
      if (r.utility) b.className = "ut"; else if (!r.bookable) b.className = "nb";
      b.innerHTML = `<span class="rn"></span><span class="rm"></span>`;
      b.querySelector(".rn").textContent = r.name;
      b.querySelector(".rm").textContent = r.utility ? "Fellesrom" : `${capText(r.cap)} · ${r.bookable ? "kan bookes" : "ikke bookbart"}`;
      b.addEventListener("click", () => {select(r.id); if (window.innerWidth <= 980) panel.scrollIntoView({behavior: "smooth", block: "start"});});
      li.appendChild(b);
      list.appendChild(li);
    });

    document.addEventListener("keydown", e => {if (e.key === "Escape" && selected) deselect();});

    function select(id) {
      if (selected === id) {deselect(); return;}
      layout.classList.add("has-selection");
      selected = id;
      const r = ROOMS.find(x => x.id === id);
      document.querySelectorAll(".room").forEach(g => g.classList.toggle("selected", g.dataset.id === id));
      list.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.parentElement.dataset.id === id ? "true" : "false"));

      if (r.utility) {
        panel.innerHTML = `<h2></h2><p class="type"></p><h3>Brukes til</h3><p class="f-use"></p><h3>Utstyr</h3><ul class="gear"></ul>`;
        panel.querySelector("h2").textContent = r.name;
        panel.querySelector(".type").textContent = r.type;
        panel.querySelector(".f-use").textContent = r.use;
        const ul = panel.querySelector(".gear");
        r.gear.forEach(gItem => {const li = document.createElement("li"); li.textContent = gItem; ul.appendChild(li);});
        return;
      }
      panel.innerHTML = `
    <h2></h2>
    <span class="runes" aria-hidden="true"></span>
    <p class="type"></p>
    <div class="facts">
      <div class="fact"><b class="f-cap"></b><small>Kapasitet</small></div>
      <div class="fact ${r.bookable ? "yes" : "no"}"><b>${r.bookable ? "Ja" : "Nei"}</b><small>${r.bookable ? "Kan bookes" : "Kan ikke bookes"}</small></div>
    </div>
    <h3>Brukes til</h3>
    <p class="f-use"></p>
    <h3>Utstyr</h3>
    <ul class="gear"></ul>
    <div class="lore"><h3>Bakgrunnen for navnet</h3><p class="f-lore"></p></div>`;
      panel.querySelector("h2").textContent = r.name;
      panel.querySelector(".runes").textContent = toRunes(r.name);
      panel.querySelector(".type").textContent = r.type;
      panel.querySelector(".f-cap").textContent = capText(r.cap);
      panel.querySelector(".f-use").textContent = r.use;
      panel.querySelector(".f-lore").textContent = r.lore;
      const ul = panel.querySelector(".gear");
      r.gear.forEach(gItem => {const li = document.createElement("li"); li.textContent = gItem; ul.appendChild(li);});
    }

    function applyFilter() {
      ROOMS.forEach(r => {
        const hide =
          filter === "utility" ? !r.utility :
            r.utility ? filter !== "all" :
              (filter === "yes" && !r.bookable) || (filter === "no" && r.bookable);
        document.querySelector(`.room[data-id="${r.id}"]`).classList.toggle("dimmed", hide);
        list.querySelector(`li[data-id="${r.id}"]`).classList.toggle("dimmed", hide);
      });
    }
    document.querySelectorAll(".filters button").forEach(btn => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
        applyFilter();
      });
    });
  </script>
