<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Romkart – møterommene våre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+Runic&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Møterommene våre</h1>
      <span class="runes" aria-hidden="true">ᛗᛟᛏᛖᚱᛟᛗᛗᛖᚾᛖ ᚹᚨᚱᛖ</span>
      <!-- <p>Trykk på et rom i kartet eller i lista for å se hvor mange det er plass til, hva rommet brukes til, hvilket
        utstyr som finnes der og hvem rommet er oppkalt etter.</p> -->
    </header>

    <div class="controls">
      <div class="filters" role="group" aria-label="Filtrer rom">
        <button type="button" data-filter="all" aria-pressed="true">Alle rom</button>
        <button type="button" data-filter="yes" aria-pressed="false">Kan bookes</button>
        <button type="button" data-filter="no" aria-pressed="false">Kan ikke bookes</button>
        <button type="button" data-filter="utility" aria-pressed="false">Fasiliteter</button>
      </div>
      <div class="legend">
        <span><i class="sw book"></i>Kan bookes</span>
        <span><i class="sw nobook"></i>Kan ikke bookes</span>
        <span><i class="sw common"></i>Fellesareal</span>
        <span><i class="sw door"></i>Inngang</span>
        <span><i class="sw exit"></i>Nødutgang</span>
      </div>
    </div>

    <div class="layout">
      <div class="map-frame">
        <svg id="map" viewBox="20 240 1320 625" role="group" aria-label="Plantegning med møterom">
          <!-- Ytterkontur -->
          <polygon class="floor"
            points="30,455 205,455 205,340 518,340 518,256 995,256 995,343 1162,343 1162,455 1330,455 1330,818 30,818" />
          <rect class="service" x="1148" y="254" width="122" height="88" />
          <text class="service-label" x="1209" y="303" text-anchor="middle">Heis</text>

          <!-- Fellesareal og service -->
          <rect class="area" x="45" y="465" width="305" height="343" />
          <text class="area-label" x="197" y="640" text-anchor="middle">Kontorlandskap</text>

          <rect class="area" x="1085" y="465" width="235" height="343" />
          <text class="area-label" x="1250" y="690" text-anchor="middle">Lukket</text>
          <text class="area-label" x="1250" y="708" text-anchor="middle">kontorlandskap</text>

          <rect class="area" x="997" y="345" width="83" height="413" />
          <text class="area-label" x="1038" y="560" text-anchor="middle" transform="rotate(-90 1038 560)">Entré</text>
          <rect class="area" x="1083" y="345" width="76" height="108" />
          <text class="area-label" x="1121" y="404" text-anchor="middle">Velkomst</text>


          <rect class="service" x="468" y="462" width="47" height="80" />
          <text class="service-label" x="491" y="498" text-anchor="middle">WC</text>
          <text class="service-label sub" x="491" y="513" text-anchor="middle">Herre</text>
          <rect class="service" x="468" y="542" width="47" height="80" />
          <text class="service-label" x="491" y="578" text-anchor="middle">WC</text>
          <text class="service-label sub" x="491" y="593" text-anchor="middle">Dame</text>
          <line class="door inner" x1="478" y1="462" x2="505" y2="462" />
          <line class="door inner" x1="478" y1="622" x2="505" y2="622" />

          <rect class="service" x="810" y="455" width="180" height="26" />
          <text class="service-label" x="900" y="473" text-anchor="middle">Teknisk rom</text>
          <rect class="service" x="810" y="481" width="90" height="79" />
          <text class="service-label" x="855" y="525" text-anchor="middle">WC</text>
          <rect class="service" x="900" y="481" width="90" height="79" />
          <text class="service-label" x="945" y="525" text-anchor="middle">WC</text>
          <!-- <rect class="service" x="810" y="560" width="180" height="62" />
          <text class="service-label" x="900" y="595" text-anchor="middle">Lagring</text> -->
          <line class="door inner" x1="840" y1="560" x2="870" y2="560" />
          <line class="door inner" x1="930" y1="560" x2="960" y2="560" />
          <rect class="service" x="910" y="675" width="80" height="37" />
          <text class="service-label" x="950" y="698" text-anchor="middle">Garderobe</text>

          <!-- Innganger og nødutgang -->
          <line class="door" x1="1012" y1="343" x2="1066" y2="343" />
          <text class="marker-label" x="1039" y="326" text-anchor="middle">▼ Inngang</text>
          <line class="door" x1="1012" y1="818" x2="1066" y2="818" />
          <text class="marker-label" x="1039" y="845" text-anchor="middle">▲ Inngang</text>
          <line class="door exit" x1="205" y1="414" x2="205" y2="450" />
          <text class="marker-label exit" x="194" y="437" text-anchor="end">Nødutgang ◀</text>

          <g id="rooms"></g>

          <!-- Dører til rommene -->
          <g id="doors">
            <line class="door inner" x1="235" y1="406" x2="263" y2="406" />
            <line class="door inner" x1="310" y1="406" x2="334" y2="406" />
            <line class="door inner" x1="366" y1="406" x2="390" y2="406" />
            <line class="door inner" x1="446" y1="406" x2="477" y2="406" />
            <line class="door inner" x1="632" y1="406" x2="662" y2="406" />
            <line class="door inner" x1="830" y1="357" x2="830" y2="393" />
            <line class="open-edge" x1="836" y1="406" x2="990" y2="406" />
            <line class="open-edge dash" x1="836" y1="406" x2="990" y2="406" />
            <line class="door inner" x1="396" y1="622" x2="430" y2="622" />
            <line class="door inner" x1="396" y1="462" x2="430" y2="462" />
            <line class="door inner" x1="531" y1="622" x2="562" y2="622" />
            <line class="door inner" x1="420" y1="676" x2="456" y2="676" />
            <line class="door inner" x1="764" y1="678" x2="798" y2="678" />
            <line class="door inner" x1="990" y1="576" x2="990" y2="606" />
            <line class="door inner" x1="990" y1="746" x2="990" y2="782" />
            <line class="door inner" x1="1120" y1="563" x2="1150" y2="563" />
          </g>
        </svg>
      </div>

      <aside class="panel" id="panel" aria-live="polite">
        <p class="empty">Velg et rom for å se detaljene.</p>
      </aside>
    </div>

    <section class="list-section">
      <h2>Alle rom</h2>
      <ul class="room-list" id="list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
